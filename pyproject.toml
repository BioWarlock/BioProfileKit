[build-system]
requires = [
    "setuptools==82.0.0",
    "wheel>=0.44.0",
    "cython>=3.2.1",
    "numpy>=2.4.2"
]
build-backend = "setuptools.build_meta"

[project]
name = "BioProfileKit"
version = "0.1"
description = "BioProfileKit analysis biological tabular data"
readme = "README.md"
authors = [
    {name = "Sonja Diedrich", email = "sonja.diedrich@computational.bio.uni-giessen.de"},
    {name = "Maria Hansen", email = "maria.hansen@computational.bio.uni-giessen.de"}
]
license = {file = "LICENSE"}
requires-python = ">=3.13"
keywords = ["bioinformatics", "data-analysis", "proteomics", "EDA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "cython==3.2.4",
    "click>=8.3.3",
    "Jinja2==3.1.6",
    "numpy==2.4.4",
    "pandas==3.0.3",
    "plotly==6.7.0",
    "scipy==1.17.1",
    "termcolor==3.3.0",
    "pyarrow==24.0.0",
    "peptides==0.5.0",
    "iteration_utilities==0.13.0",
    "requests==2.33.0",
    "goatools==1.5.2",
    "importlib_resources==7.1.0",
    "biopython==1.87",
    "weblogo==3.9.0",
]
[project.urls]
Homepage="https://github.com/BioWarlock/BioProfileKit/"
Repository="https://github.com/BioWarlock/BioProfileKit/"

[project.optional-dependencies]
cli = ["click"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
"static" = ["static/**/*"]
"templates" = ["*.jinja"]
#"cython" = ["*.pyx"]

[tool.setuptools.exclude-package-data]
"*" = [
    "*.pyc",
    "*/__pycache__/*",
    "*.egg-info"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["src"]
omit = ["src/cython_wrapper/*"]

[project.scripts]
bioprofilekit = "cli.app:cli"
